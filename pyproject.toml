[project]
name = "weft"
version = "0.1.0"
description = "Graph-native memory and coordination layer for multi-agent systems, built on FalkorDB."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "shivv23", email = "shivamkumar0423@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["agents", "memory", "falkordb", "graph", "multi-agent", "mcp"]
dependencies = [
    "falkordb>=1.0.8",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
weft = "weft.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weft"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "examples", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "SIM105", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"examples/*" = ["T201"]
"bench/*" = ["T201"]
"src/weft/cli.py" = ["T201"]
"src/weft/api/console.py" = ["E501"]
