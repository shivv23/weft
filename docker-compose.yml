name: weft

services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: weft-falkordb
    ports:
      - "6379:6379"
      - "3000:3000" # FalkorDB Browser
    environment:
      # Persisted graph-module tuning. The server otherwise defaults to
      # MAX_QUEUED_QUERIES=25, which rejects bursts from a busy agent fleet
      # long before the instance is actually saturated. THREAD_COUNT raises the
      # query-execution pool; OMP parallelism helps large scans.
      FALKORDB_ARGS: >-
        MAX_QUEUED_QUERIES 1000
        TIMEOUT 10000
        RESULTSET_SIZE 10000
        CACHE_SIZE 400
        THREAD_COUNT 8
        OMP_THREAD_COUNT 8
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  weft-api:
    build: .
    image: weft:local
    container_name: weft-api
    command: ["api"]
    environment:
      WEFT_FALKOR_HOST: falkordb
      WEFT_FALKOR_PORT: "6379"
      WEFT_EMBEDDINGS_PROVIDER: ${WEFT_EMBEDDINGS_PROVIDER:-hash}
      WEFT_LLM_PROVIDER: ${WEFT_LLM_PROVIDER:-none}
      WEFT_OPENAI_API_KEY: ${WEFT_OPENAI_API_KEY:-}
      WEFT_ANTHROPIC_API_KEY: ${WEFT_ANTHROPIC_API_KEY:-}
      WEFT_API_KEYS: ${WEFT_API_KEYS:-}
    ports:
      - "8080:8080"
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  weft-worker:
    build: .
    image: weft:local
    command: ["worker"]
    environment:
      WEFT_FALKOR_HOST: falkordb
      WEFT_FALKOR_PORT: "6379"
      WEFT_EMBEDDINGS_PROVIDER: ${WEFT_EMBEDDINGS_PROVIDER:-hash}
      WEFT_LLM_PROVIDER: ${WEFT_LLM_PROVIDER:-none}
      WEFT_OPENAI_API_KEY: ${WEFT_OPENAI_API_KEY:-}
      WEFT_ANTHROPIC_API_KEY: ${WEFT_ANTHROPIC_API_KEY:-}
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped
    # Scale independently of the API: `docker compose up --scale weft-worker=4`
    deploy:
      replicas: 1

volumes:
  falkordb-data:
